name: Android Debug APK Build

on:
  push:
    branches:
      - claude/android-build
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. 소스 체크아웃 ──────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 설정 ───────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: KotobaNoTakarabako/package-lock.json

      # ── 3. npm install ────────────────────────────
      - name: Install npm dependencies
        working-directory: KotobaNoTakarabako
        run: npm ci

      # ── 4. Java (Android 빌드용) ──────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 5. Android SDK 설정 ───────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. gradlew 실행 권한 ──────────────────────
      - name: Make gradlew executable
        working-directory: KotobaNoTakarabako/android
        run: chmod +x gradlew

      # ── 7. Gradle 캐시 ────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('KotobaNoTakarabako/android/**/*.gradle*', 'KotobaNoTakarabako/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 8. APK 빌드 ───────────────────────────────
      - name: Build Debug APK
        working-directory: KotobaNoTakarabako/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 9. APK 아티팩트 업로드 ───────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-debug-apk
          path: KotobaNoTakarabako/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
