pluginManagement {
    // node_modules 있으면 로컬 플러그인 사용, 없으면 Maven 폴백
    def rnPluginDir = file("../node_modules/@react-native/gradle-plugin")
    if (rnPluginDir.exists()) {
        includeBuild(rnPluginDir)
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    // node_modules 없을 때 React Native 플러그인을 Maven에서 다운로드
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith("com.facebook.react")) {
                useModule("com.facebook.react:react-native-gradle-plugin:0.85.3")
            }
        }
    }
}

plugins { id("com.facebook.react.settings") }

// autolinking은 node_modules 있을 때만 실행
def rnPluginDir = file("../node_modules/@react-native/gradle-plugin")
if (rnPluginDir.exists()) {
    extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
        ex.autolinkLibrariesFromCommand()
    }
    includeBuild('../node_modules/@react-native/gradle-plugin')
}

rootProject.name = 'KotobaNoTakarabako'
include ':app'
