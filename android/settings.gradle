pluginManagement {
    // node_modules가 없으면 npm install 자동 실행 (git clone 후 Android Studio 바로 열기 지원)
    def rnPluginDir = file("../node_modules/@react-native/gradle-plugin")
    if (!rnPluginDir.exists()) {
        def projectRoot = file("..")
        def isWindows = System.getProperty("os.name").toLowerCase().contains("win")
        def cmd = isWindows ? ["cmd", "/c", "npm", "install"] : ["npm", "install"]
        println ">>> [KotobaNoTakarabako] node_modules 없음 — npm install 자동 실행 중..."
        try {
            def proc = new ProcessBuilder(cmd)
                .directory(projectRoot)
                .redirectErrorStream(true)
                .start()
            proc.inputStream.eachLine { line -> println "    [npm] $line" }
            def exitCode = proc.waitFor()
            if (exitCode == 0) {
                println ">>> npm install 완료."
            } else {
                println ">>> npm install 실패 (exit $exitCode). 프로젝트 루트에서 직접 'npm install' 실행 후 Sync 다시 시도해주세요."
            }
        } catch (Exception e) {
            println ">>> npm을 찾을 수 없습니다: ${e.message}"
            println ">>> Node.js가 설치되어 있는지 확인하고, 프로젝트 루트에서 'npm install' 실행 후 Sync 다시 시도해주세요."
        }
    }

    if (file("../node_modules/@react-native/gradle-plugin").exists()) {
        includeBuild(file("../node_modules/@react-native/gradle-plugin"))
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins { id("com.facebook.react.settings") }

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

includeBuild('../node_modules/@react-native/gradle-plugin')

rootProject.name = 'KotobaNoTakarabako'
include ':app'
